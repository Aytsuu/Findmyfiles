[project]
name = "findmyfiles"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.33",
    "chromadb>=0.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "watchdog>=4.0",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "Pillow>=10.0",
    "pydantic-settings>=2.0",
    "tomli>=2.0",
    "tenacity>=8.0",       # retry / backoff
    "tiktoken>=0.7",       # token counting for chunking
]

[project.scripts]
findmyfiles = "findmyfiles.main:run"
